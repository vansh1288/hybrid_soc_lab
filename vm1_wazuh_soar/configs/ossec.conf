<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <smtp_server>smtp.example.com</smtp_server>
    <email_from>wazuh@localhost</email_from>
    <email_to>admin@example.com</email_to>
    <email_maxperhour>12</email_maxperhour>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <syslog_output>
    <server>${VM2_IP}</server>
    <port>514</port>
    <format>json</format>
    <level>12</level>
    <mode>udp</mode>
  </syslog_output>

  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <force_insert>no</force_insert>
    <force_time>0</force_time>
    <purge>yes</purge>
    <use_password>yes</use_password>
    <limit_maxagents>1000</limit_maxagents>
    <ciphers>HIGH:!ADH:!EXP:!MD5:!RC4:!3DES:!CAMELLIA:@STRENGTH</ciphers>
    <ssl_agent_ca></ssl_agent_ca>
    <ssl_verify_host>no</ssl_verify_host>
    <ssl_manager_cert></ssl_manager_cert>
    <ssl_manager_key></ssl_manager_key>
    <ssl_auto_negotiate>no</ssl_auto_negotiate>
  </auth>

  <agentless>
    <enabled>no</enabled>
  </agentless>

  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>udp</protocol>
    <allowed_ips>
      <address>0.0.0.0/0</address>
    </allowed_ips>
    <queue_size>131072</queue_size>
    <max_threads>16</max_threads>
  </remote>

  <analysisd>
    <default_ruleset>yes</default_ruleset>
    <auto_ignore>yes</auto_ignore>
    <auto_ignore_level>3</auto_ignore_level>
    <event_queue_size>16384</event_queue_size>
    <syscheck_queue_size>16384</syscheck_queue_size>
    <rootcheck_queue_size>16384</rootcheck_queue_size>
    <hostinfo_queue_size>16384</hostinfo_queue_size>
    <rule_matching>yes</rule_matching>
    <full_log>no</full_log>
    <json_output>yes</json_output>
    <stats>yes</stats>
    <decoder_json_output>yes</decoder_json_output>
    <archives>
      <log_format>json</log_format>
    </archives>
  </analysisd>

  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <directories check_all="yes">/etc,/usr/bin,/usr/sbin</directories>
    <directories check_all="yes">/bin,/sbin,/boot</directories>
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/random.seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/httpd/logs</ignore>
    <ignore>/etc/utmpx</ignore>
    <ignore>/etc/wtmpx</ignore>
    <ignore>/etc/cups/certs</ignore>
    <ignore>/etc/dumpdates</ignore>
    <ignore>/etc/svc/volatile</ignore>
    <ignore>/var/log</ignore>
    <ignore>/var/run</ignore>
    <ignore>/var/spool</ignore>
    <ignore>/var/spool/mail</ignore>
    <ignore>/var/spool/rwho</ignore>
    <ignore>/var/spool/cron</ignore>
    <ignore>/var/spool/cron/crontabs</ignore>
    <ignore>/var/lib/dpkg/info</ignore>
    <ignore>/var/lib/rpm</ignore>
    <ignore>/var/cache/yum</ignore>
    <ignore>/var/lib/apt</ignore>
    <ignore>/var/lib/snapd</ignore>
    <ignore>/var/lib/docker</ignore>
    <ignore>/var/lib/containerd</ignore>
    <ignore>/var/snap</ignore>
    <ignore>/snap</ignore>
    <nodiff>/var/log</nodiff>
    <nodiff>/var/run</nodiff>
    <windows_registry>HKEY_LOCAL_MACHINE\Software</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\System</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\Security</windows_registry>
    <registry_ignore>HKEY_LOCAL_MACHINE\Security\Policy\Secrets</registry_ignore>
    <registry_ignore>HKEY_LOCAL_MACHINE\Security\SAM</registry_ignore>
    <registry_ignore>HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Uninstall</registry_ignore>
    <registry_ignore>HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run</registry_ignore>
    <registry_ignore>HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\RunOnce</registry_ignore>
    <skip_dev>yes</skip_dev>
    <skip_proc>yes</skip_proc>
    <skip_sys>yes</skip_sys>
    <synchronization>
      <enabled>yes</enabled>
      <interval>300</interval>
      <max_queue_size>16384</max_queue_size>
    </synchronization>
  </syscheck>

  <rootcheck>
    <disabled>no</disabled>
    <check_all>yes</check_all>
    <check_files>yes</check_files>
    <check_if>yes</check_if>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_shim>yes</check_shim>
    <check_trojans>yes</check_trojans>
    <check_unixaudit>yes</check_unixaudit>
    <check_winapps>yes</check_winapps>
    <check_winaudit>yes</check_winaudit>
    <check_winmalware>yes</check_winmalware>
    <system_audit>sshd_config,systemd_config</system_audit>
    <rootkit_files>/var/ossec/etc/shared/rootkit_files.txt</rootkit_files>
    <rootkit_trojans>/var/ossec/etc/shared/rootkit_trojans.txt</rootkit_trojans>
    <windows_audit>
      <system_audit>win_audit_system</system_audit>
      <malware_audit>win_audit_malware</malware_audit>
      <malware_audit_interval>300</malware_audit_interval>
    </windows_audit>
  </rootcheck>

  <wodle name="command">
    <disabled>no</disabled>
    <tag>wazuh-command</tag>
    <command>/bin/bash /var/ossec/active-response/bin/av-scanner.sh</command>
    <interval>0</interval>
    <ignore_output>no</ignore_output>
    <run_on_start>no</run_on_start>
  </wodle>

  <wodle name="open-scap">
    <disabled>yes</disabled>
    <timeout>1800</timeout>
    <interval>1d</interval>
    <scan_on_start>yes</scan_on_start>
  </wodle>

  <wodle name="cis-cat">
    <disabled>yes</disabled>
    <timeout>1800</timeout>
    <interval>1d</interval>
    <scan_on_start>yes</scan_on_start>
    <java_path>/usr/lib/jvm/default-java/bin/java</java_path>
  </wodle>

  <wodle name="aws-s3">
    <disabled>yes</disabled>
    <interval>10m</interval>
    <run_on_start>yes</run_on_start>
    <skip_on_error>yes</skip_on_error>
  </wodle>

  <wodle name="azure-logs">
    <disabled>yes</disabled>
    <interval>1d</interval>
    <run_on_start>yes</run_on_start>
  </wodle>

  <wodle name="gcp-pubsub">
    <disabled>yes</disabled>
    <interval>10m</interval>
    <run_on_start>yes</run_on_start>
  </wodle>

  <wodle name="osquery">
    <disabled>yes</disabled>
    <run_daemon>yes</run_daemon>
    <log_path>/var/ossec/logs/osquery.log</log_path>
    <config_path>/var/ossec/etc/osquery.conf</config_path>
  </wodle>

  <wodle name="docker-listener">
    <disabled>yes</disabled>
    <interval>10m</interval>
    <attempts>5</attempts>
    <run_on_start>yes</run_on_start>
  </wodle>

  <wodle name="agent-upgrade">
    <disabled>no</disabled>
    <timeout>0</timeout>
    <interval>0</interval>
    <run_on_start>yes</run_on_start>
    <version>4.7.0</version>
    <url>https://packages.wazuh.com/4.x/apt/</url>
    <verify>yes</verify>
  </wodle>

  <labels>
    <label key="environment">production</label>
    <label key="role">tier1-siem-soar</label>
  </labels>
</ossec_config>