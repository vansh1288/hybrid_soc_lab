# Splunk inputs.conf for VM2 (Tier 2 Analytics & NIDS)
# Location: $SPLUNK_HOME/etc/apps/search/local/inputs.conf

# UDP Syslog input for Wazuh alerts (Level 12+)
[udp://514]
connection_host = ip
sourcetype = wazuh_json
index = main
no_appending_timestamp = true
no_priority_stripping = true
rcvbuf = 15728640

# TCP Syslog input for Wazuh alerts (Level 12+)
[tcp://514]
connection_host = ip
sourcetype = wazuh_json
index = main
no_appending_timestamp = true
no_priority_stripping = true

# Suricata eve.json file monitor
[monitor:///var/log/suricata/eve.json]
index = main
sourcetype = suricata_eve
disabled = false
whitelist = *.json
recursive = true
initCrcLength = 2048

# Suricata stats.log monitor
[monitor:///var/log/suricata/stats.log]
index = main
sourcetype = suricata_stats
disabled = false

# Wazuh agent logs (if agents also report directly to Splunk)
[monitor:///var/ossec/logs/alerts/alerts.json]
index = main
sourcetype = wazuh_json
disabled = true
recursive = false

