# Splunk props.conf for VM2 (Tier 2 Analytics & NIDS)
# Location: $SPLUNK_HOME/etc/apps/search/local/props.conf

# ============================================================
# Wazuh JSON Alerts (syslog forwarded from VM1)
# ============================================================
[wazuh_json]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 0
INDEXED_EXTRACTIONS = json
KV_MODE = none
TIMESTAMP_FIELDS = @timestamp
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
TZ = UTC
MAX_TIMESTAMP_LOOKAHEAD = 32
CATEGORY = Structured
DESCRIPTION = Wazuh JSON alerts forwarded via syslog from Tier 1 SIEM
PULP_EOL = \n
DATETIME_CONFIG = CURRENT

# Field aliases for common Wazuh fields
FIELDALIAS-wazuh_agent_name = agent.name AS agent_name
FIELDALIAS-wazuh_agent_id = agent.id AS agent_id
FIELDALIAS-wazuh_agent_ip = agent.ip AS agent_ip
FIELDALIAS-wazuh_rule_id = rule.id AS rule_id
FIELDALIAS-wazuh_rule_level = rule.level AS rule_level
FIELDALIAS-wazuh_rule_description = rule.description AS rule_description
FIELDALIAS-wazuh_rule_groups = rule.groups AS rule_groups
FIELDALIAS-wazuh_mitre_id = rule.mitre.id AS mitre_id
FIELDALIAS-wazuh_winlog_event_id = winlog.event_id AS winlog_event_id
FIELDALIAS-wazuh_winlog_channel = winlog.channel AS winlog_channel
FIELDALIAS-wazuh_process_image = win.eventdata.image AS process_image
FIELDALIAS-wazuh_process_pid = win.eventdata.processid AS process_pid
FIELDALIAS-wazuh_process_commandline = win.eventdata.commandline AS process_commandline
FIELDALIAS-wazuh_process_parent_image = win.eventdata.parentimage AS process_parent_image
FIELDALIAS-wazuh_process_parent_pid = win.eventdata.parentprocessid AS process_parent_pid
FIELDALIAS-wazuh_target_image = win.eventdata.targetimage AS target_image
FIELDALIAS-wazuh_target_pid = win.eventdata.targetprocessid AS target_pid
FIELDALIAS-wazuh_granted_access = win.eventdata.grantedaccess AS granted_access
FIELDALIAS-wazuh_hash_sha256 = win.eventdata.hashes.sha256 AS file_hash_sha256
FIELDALIAS-wazuh_target_filename = win.eventdata.targetfilename AS target_filename
FIELDALIAS-wazuh_network_protocol = win.eventdata.protocol AS network_protocol
FIELDALIAS-wazuh_src_ip = win.eventdata.sourceip AS src_ip
FIELDALIAS-wazuh_src_port = win.eventdata.sourceport AS src_port
FIELDALIAS-wazuh_dst_ip = win.eventdata.destinationip AS dst_ip
FIELDALIAS-wazuh_dst_port = win.eventdata.destinationport AS dst_port
FIELDALIAS-wazuh_user = win.eventdata.user AS user_name
FIELDALIAS-wazuh_domain = win.eventdata.domain AS user_domain
FIELDALIAS-wazuh_user_sid = win.eventdata.usersid AS user_sid

# Auto-extract JSON fields
AUTO_KV_JSON = true

# ============================================================
# Suricata EVE JSON logs
# ============================================================
[suricata_eve]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 0
INDEXED_EXTRACTIONS = json
KV_MODE = none
TIMESTAMP_FIELDS = timestamp
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%z
TZ = UTC
MAX_TIMESTAMP_LOOKAHEAD = 32
CATEGORY = Structured
DESCRIPTION = Suricata EVE JSON output
DATETIME_CONFIG = CURRENT

# Field aliases for Suricata
FIELDALIAS-suricata_timestamp = timestamp AS _time
FIELDALIAS-suricata_event_type = event_type AS event_type
FIELDALIAS-suricata_src_ip = src_ip AS src_ip
FIELDALIAS-suricata_src_port = src_port AS src_port
FIELDALIAS-suricata_dest_ip = dest_ip AS dest_ip
FIELDALIAS-suricata_dest_port = dest_port AS dest_port
FIELDALIAS-suricata_proto = proto AS protocol
FIELDALIAS-suricata_alert_signature = alert.signature AS alert_signature
FIELDALIAS-suricata_alert_category = alert.category AS alert_category
FIELDALIAS-suricata_alert_severity = alert.severity AS alert_severity
FIELDALIAS-suricata_alert_signature_id = alert.signature_id AS alert_signature_id
FIELDALIAS-suricata_alert_gid = alert.gid AS alert_gid
FIELDALIAS-suricata_alert_rev = alert.rev AS alert_rev
FIELDALIAS-suricata_http_hostname = http.hostname AS http_hostname
FIELDALIAS-suricata_http_url = http.url AS http_url
FIELDALIAS-suricata_http_user_agent = http.http_user_agent AS http_user_agent
FIELDALIAS-suricata_dns_query = dns.query AS dns_query
FIELDALIAS-suricata_dns_type = dns.type AS dns_type
FIELDALIAS-suricata_tls_ja3 = tls.ja3_hash AS tls_ja3_hash
FIELDALIAS-suricata_tls_sni = tls.sni AS tls_sni
FIELDALIAS-suricata_flow_pkts_toserver = flow.pkts_toserver AS flow_pkts_toserver
FIELDALIAS-suricata_flow_pkts_toclient = flow.pkts_toclient AS flow_pkts_toclient
FIELDALIAS-suricata_flow_bytes_toserver = flow.bytes_toserver AS flow_bytes_toserver
FIELDALIAS-suricata_flow_bytes_toclient = flow.bytes_toclient AS flow_bytes_toclient

AUTO_KV_JSON = true

# ============================================================
# Suricata stats.log
# ============================================================
[suricata_stats]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 10000
INDEXED_EXTRACTIONS = json
KV_MODE = none
TIMESTAMP_FIELDS = timestamp
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%z
TZ = UTC
CATEGORY = Structured
DESCRIPTION = Suricata stats log
DATETIME_CONFIG = CURRENT

AUTO_KV_JSON = true

# ============================================================
# Windows XML Event Logs (Sysmon, Security)
# ============================================================
[xmlwineventlog]
SHOULD_LINEMERGE = true
BREAK_ONLY_BEFORE = <Event\s
MUST_BREAK_AFTER = </Event>
TRUNCATE = 0
MAX_EVENTS = 1000
KV_MODE = xml
TIMESTAMP_FIELDS = System/TimeCreated/@SystemTime
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%z
TZ = UTC
CATEGORY = Windows Event Log
DESCRIPTION = Windows Event Logs in XML format (Sysmon, Security)
DATETIME_CONFIG = CURRENT

# ============================================================
# Generic JSON sourcetype fallback
# ============================================================
[json]
INDEXED_EXTRACTIONS = json
KV_MODE = none
AUTO_KV_JSON = true