<ossec_config>
  <client>
    <server>
      <address>MANAGER_IP</address>
      <port>1514</port>
      <protocol>udp</protocol>
    </server>
    <config-profile>windows,windows-server-2022</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>16384</queue_size>
    <max_eps>500</max_eps>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- Sysmon Event Channel Collection -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Windows Security Event Log -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <only-future-events>yes</only-future-events>
    <query>Event/System[EventID=4624 or EventID=4625 or EventID=4634 or EventID=4648 or EventID=4672 or EventID=4688 or EventID=4698 or EventID=4699 or EventID=4700 or EventID=4701 or EventID=4702 or EventID=4703 or EventID=4719 or EventID=4720 or EventID=4722 or EventID=4723 or EventID=4724 or EventID=4725 or EventID=4726 or EventID=4727 or EventID=4728 or EventID=4729 or EventID=4730 or EventID=4731 or EventID=4732 or EventID=4733 or EventID=4734 or EventID=4735 or EventID=4737 or EventID=4738 or EventID=4739 or EventID=4740 or EventID=4741 or EventID=4742 or EventID=4743 or EventID=4744 or EventID=4745 or EventID=4746 or EventID=4747 or EventID=4748 or EventID=4749 or EventID=4750 or EventID=4751 or EventID=4752 or EventID=4753 or EventID=4754 or EventID=4755 or EventID=4756 or EventID=4757 or EventID=4758 or EventID=4759 or EventID=4760 or EventID=4761 or EventID=4762 or EventID=4763 or EventID=4764 or EventID=4765 or EventID=4766 or EventID=4767 or EventID=4768 or EventID=4769 or EventID=4770 or EventID=4771 or EventID=4772 or EventID=4773 or EventID=4774 or EventID=4775 or EventID=4776 or EventID=4777 or EventID=4778 or EventID=4779 or EventID=4780 or EventID=4781 or EventID=4782 or EventID=4783 or EventID=4784 or EventID=4785 or EventID=4786 or EventID=4787 or EventID=4788 or EventID=4789 or EventID=4790 or EventID=4791 or EventID=4792 or EventID=4793 or EventID=4794 or EventID=4795 or EventID=4796 or EventID=4797 or EventID=4798 or EventID=4799 or EventID=4800 or EventID=4801 or EventID=4802 or EventID=4803 or EventID=4804 or EventID=4805 or EventID=4806 or EventID=4807 or EventID=4808 or EventID=4809 or EventID=4810 or EventID=4811 or EventID=4812 or EventID=4813 or EventID=4814 or EventID=4815 or EventID=4816 or EventID=4817 or EventID=4818 or EventID=4819 or EventID=4820 or EventID=4821 or EventID=4822 or EventID=4823 or EventID=4824 or EventID=4825 or EventID=4826 or EventID=4827 or EventID=4828 or EventID=4829 or EventID=4830 or EventID=4831 or EventID=4832 or EventID=4833 or EventID=4834 or EventID=4835 or EventID=4836 or EventID=4837 or EventID=4838 or EventID=4839 or EventID=4840 or EventID=4841 or EventID=4842 or EventID=4843 or EventID=4844 or EventID=4845 or EventID=4846 or EventID=4847 or EventID=4848 or EventID=4849 or EventID=4849 or EventID=4850 or EventID=4851 or EventID=4852 or EventID=4853 or EventID=4854 or EventID=4855 or EventID=4856 or EventID=4857 or EventID=4858 or EventID=4859 or EventID=4860 or EventID=4859 or EventID=4861 or EventID=4862 or EventID=4863 or EventID=4864 or EventID=4865 or EventID=4866 or EventID=4867 or EventID=4868 or EventID=4869 or EventID=4870 or EventID=4871 or EventID=4872 or EventID=4873 or EventID=4874 or EventID=4875 or EventID=4876 or EventID=4877 or EventID=4878 or EventID=4879 or EventID=4880 or EventID=4881 or EventID=4882 or EventID=4883 or EventID=4884 or EventID=4885 or EventID=4886 or EventID=4887 or EventID=4888 or EventID=4889 or EventID=4890 or EventID=4891 or EventID=4892 or EventID=4893 or EventID=4894 or EventID=4895 or EventID=4896 or EventID=4897 or EventID=4898 or EventID=4899 or EventID=4900 or EventID=4901 or EventID=4902 or EventID=4903 or EventID=4904 or EventID=4905 or EventID=4906 or EventID=4907 or EventID=4908 or EventID=4909 or EventID=4910 or EventID=4911 or EventID=4912 or EventID=4913 or EventID=4914 or EventID=4915 or EventID=4916 or EventID=4917 or EventID=4918 or EventID=4919 or EventID=4920 or EventID=4921 or EventID=4922 or EventID=4923 or EventID=4924 or EventID=4925 or EventID=4926 or EventID=4927 or EventID=4928 or EventID=4929 or EventID=4930 or EventID=4931 or EventID=4932 or EventID=4933 or EventID=4934 or EventID=4935 or EventID=4936 or EventID=4937 or EventID=4938 or EventID=4939 or EventID=4940 or EventID=4941 or EventID=4942 or EventID=4943 or EventID=4944 or EventID=4945 or EventID=4946 or EventID=4947 or EventID=4948 or EventID=4949 or EventID=4950 or EventID=4951 or EventID=4952 or EventID=4953 or EventID=4954 or EventID=4955 or EventID=4956 or EventID=4957 or EventID=4958 or EventID=4959 or EventID=4960 or EventID=4961 or EventID=4962 or EventID=4963 or EventID=4964 or EventID=4965 or EventID=4966 or EventID=4967 or EventID=4968 or EventID=4969 or EventID=4970 or EventID=4971 or EventID=4972 or EventID=4973 or EventID=4974 or EventID=4975 or EventID=4976 or EventID=4977 or EventID=4978 or EventID=4979 or EventID=4980 or EventID=4981 or EventID=4982 or EventID=4983 or EventID=4984 or EventID=4985 or EventID=4986 or EventID=4987 or EventID=4988 or EventID=4989 or EventID=4990 or EventID=4991 or EventID=4992 or EventID=4993 or EventID=4994 or EventID=4995 or EventID=4996 or EventID=4997 or EventID=4998 or EventID=4999 or EventID=5000]</query>
  </localfile>

  <!-- Windows System Event Log -->
  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
    <only-future-events>yes</only-future-events>
    <query>Event/System[EventID=7045 or EventID=7036 or EventID=7035 or EventID=7034 or EventID=7031 or EventID=7030 or EventID=104 or EventID=6005 or EventID=6006 or EventID=6008 or EventID=6009 or EventID=6013]</query>
  </localfile>

  <!-- Windows Application Event Log -->
  <localfile>
    <location>Application</location>
    <log_format>eventchannel</log_format>
    <only-future-events>yes</only-future-events>
    <query>Event/System[EventID=1000 or EventID=1001 or EventID=1002 or EventID=1005 or EventID=1026]</query>
  </localfile>

  <!-- Windows PowerShell Operational Log -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
    <only-future-events>yes</only-future-events>
    <query>Event/System[EventID=4103 or EventID=4104 or EventID=400 or EventID=600 or EventID=800]</query>
  </localfile>

  <!-- Windows PowerShell Core/6+ Operational Log -->
  <localfile>
    <location>PowerShellCore/Operational</location>
    <log_format>eventchannel</log_format>
    <only-future-events>yes</only-future-events>
  </localfile>

  <!-- Windows WMI Activity -->
  <localfile>
    <location>Microsoft-Windows-WMI-Activity/Operational</location>
    <log_format>eventchannel</log_format>
    <only-future-events>yes</only-future-events>
  </localfile>

  <!-- Windows Terminal Services (RDP) -->
  <localfile>
    <location>Microsoft-Windows-TerminalServices-LocalSessionManager/Operational</location>
    <log_format>eventchannel</log_format>
    <only-future-events>yes</only-future-events>
  </localfile>

  <localfile>
    <location>Microsoft-Windows-TerminalServices-RDPClient/Operational</location>
    <log_format>eventchannel</log_format>
    <only-future-events>yes</only-future-events>
  </localfile>

  <!-- Windows AppLocker -->
  <localfile>
    <location>Microsoft-Windows-AppLocker/EXE and DLL</location>
    <log_format>eventchannel</log_format>
    <only-future-events>yes</only-future-events>
  </localfile>

  <localfile>
    <location>Microsoft-Windows-AppLocker/MSI and Script</location>
    <log_format>eventchannel</log_format>
    <only-future-events>yes</only-future-events>
  </localfile>

  <!-- Windows Defender / ATP -->
  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
    <only-future-events>yes</only-future-events>
  </localfile>

  <!-- Windows Firewall -->
  <localfile>
    <location>Microsoft-Windows-Windows Firewall With Advanced Security/Firewall</location>
    <log_format>eventchannel</log_format>
    <only-future-events>yes</only-future-events>
  </localfile>

  <!-- Sysmon Configuration File Monitoring -->
  <localfile>
    <location>C:\Windows\System32\drivers\etc\sysmonconfig.xml</location>
    <log_format>syslog</log_format>
  </localfile>

  <!-- Sysmon Logs (if written to file) -->
  <localfile>
    <location>C:\Windows\System32\winevt\Logs\Microsoft-Windows-Sysmon%4Operational.evtx</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Active Response -->
  <active-response>
    <disabled>no</disabled>
    <ca_store>/var/ossec/etc/wpk_root.pem</ca_store>
  </active-response>

  <!-- Labels for tagging -->
  <labels>
    <label key="environment">lab</label>
    <label key="role">target-endpoint</label>
    <label key="os">windows-server-2022</label>
    <label key="architecture">x86_64</label>
  </labels>

  <!-- Syscheck for Windows -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <directories check_all="yes">C:\Windows\System32</directories>
    <directories check_all="yes">C:\Windows\SysWOW64</directories>
    <directories check_all="yes">C:\Program Files</directories>
    <directories check_all="yes">C:\Program Files (x86)</directories>
    <ignore>C:\Windows\System32\config</ignore>
    <ignore>C:\Windows\System32\drivers\etc\hosts</ignore>
    <ignore>C:\Windows\Temp</ignore>
    <ignore>C:\Users\*\AppData\Local\Temp</ignore>
    <ignore>C:\Windows\Prefetch</ignore>
    <windows_registry>HKEY_LOCAL_MACHINE\Software</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\System</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\Security</windows_registry>
    <windows_registry>HKEY_LOCAL_MACHINE\SAM</windows_registry>
    <registry_ignore>HKEY_LOCAL_MACHINE\Security\Policy\Secrets</registry_ignore>
    <registry_ignore>HKEY_LOCAL_MACHINE\Security\SAM</registry_ignore>
    <registry_ignore>HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Uninstall</registry_ignore>
    <registry_ignore>HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run</registry_ignore>
    <registry_ignore>HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\RunOnce</registry_ignore>
    <skip_dev>yes</skip_dev>
    <skip_proc>yes</skip_proc>
    <skip_sys>yes</skip_sys>
    <synchronization>
      <enabled>yes</enabled>
      <interval>300</interval>
      <max_queue_size>16384</max_queue_size>
    </synchronization>
  </syscheck>

  <!-- Rootcheck for Windows -->
  <rootcheck>
    <disabled>no</disabled>
    <check_all>yes</check_all>
    <check_files>yes</check_files>
    <check_if>yes</check_if>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_shim>yes</check_shim>
    <check_trojans>yes</check_trojans>
    <check_unixaudit>no</check_unixaudit>
    <check_winapps>yes</check_winapps>
    <check_winaudit>yes</check_winaudit>
    <check_winmalware>yes</check_winmalware>
    <system_audit>win_audit_system</system_audit>
    <malware_audit>win_audit_malware</malware_audit>
    <malware_audit_interval>300</malware_audit_interval>
    <windows_audit>
      <system_audit>win_audit_system</system_audit>
      <malware_audit>win_audit_malware</malware_audit>
    </windows_audit>
  </rootcheck>

  <!-- Wodles -->
  <wodle name="command">
    <disabled>no</disabled>
    <tag>wazuh-command</tag>
    <command>C:\Program Files (x86)\ossec-agent\active-response\bin\av-scanner.cmd</command>
    <interval>0</interval>
    <ignore_output>no</ignore_output>
    <run_on_start>no</run_on_start>
  </wodle>

  <wodle name="osquery">
    <disabled>yes</disabled>
  </wodle>

  <wodle name="docker-listener">
    <disabled>yes</disabled>
  </wodle>

  <wodle name="agent-upgrade">
    <disabled>no</disabled>
    <timeout>0</timeout>
    <interval>0</interval>
    <run_on_start>yes</run_on_start>
  </wodle>
</ossec_config>